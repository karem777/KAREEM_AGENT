name: Desktop safety tests

on:
  pull_request:
    paths:
      - "tools/desktop.py"
      - "tests/test_desktop_tool_safety.py"
      - ".github/workflows/desktop-safety.yml"
  push:
    branches:
      - main
      - "refactor/**"
      - "feat/**"

jobs:
  desktop-safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run desktop safety tests
        run: python -m unittest tests.test_desktop_tool_safety -v
